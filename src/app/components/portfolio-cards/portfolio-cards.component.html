<div class="portfolio-container">
  <h2>My Work</h2>
  <div class="cards-wrapper">
    <div 
      class="card" 
      *ngFor="let project of projects" 
      [style.backgroundImage]="'url(' + project.background + ')'">
      <div class="card-content">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
      </div>
    </div>
  </div>
</div>
