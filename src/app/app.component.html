<app-header></app-header>

<app-words-loader 
  *ngIf="!isLoaderDestroyed"
  [isLoading]="isLoading" 
  (onLoaderHidden)="onLoaderAnimationFinish()">
</app-words-loader>

<div class="content-wrapper" [style.opacity]="isLoaderDestroyed ? 1 : 0">

  <section id="home" data-section class="hero-section">
    
    <!-- We will use this SINGLE set of elements for ALL screen sizes -->
    <div class="hero-left">
      <h1>
        <span class="intro-text">Hey, I'm</span>
        <span class="name-text">Sourabh Gour</span>
      </h1>
    </div>

    <div class="hero-center">
      <app-scene (onSceneReady)="onSceneInitialized()"></app-scene>
    </div>

    <div class="hero-right">
      <p>I'm a</p>
      <app-word-cycler></app-word-cycler>
    </div>

  </section>

  <main class="main-content">
    <section id="about" data-section class="about-section">
      <h2>ABOUT ME</h2>
      <p>A passionate developer and designer...</p>
      <h3>SKILLS: Angular, TypeScript, Three.js, GSAP, SCSS</h3>
    </section>

     <!-- === NEW PORTFOLIO SECTION === -->
    <section id="portfolio" data-section class="bento-section">
      <h2>My Work</h2>
      <app-bento-grid [items]="workItems"></app-bento-grid>
    </section>

    <!-- === NEW CERTIFICATES SECTION === -->
    <section id="certificates" data-section class="bento-section">
      <h2>Certificates</h2>
      <app-bento-grid [items]="certificateItems"></app-bento-grid>
    </section>

    <section id="contact" data-section class="placeholder-section">
      <h2>Contact</h2>
      <p>Coming soon...</p>
    </section>
  </main>
</div>
